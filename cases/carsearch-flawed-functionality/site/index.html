<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Used cars near Bristol · Motorwise</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        document.addEventListener('click', (e) => {
          const el = e.target.closest && e.target.closest("[data-action=\"open-filters\"]");
          if (!el) return;
          e.stopPropagation();
        }, true);
        document.addEventListener('change', (e) => { if (e.target.matches && e.target.matches('[data-make]')) e.stopImmediatePropagation(); }, true);
        document.addEventListener('change', (e) => { if (e.target.matches && e.target.matches('[data-compare]')) { e.stopImmediatePropagation(); e.target.checked = false; } }, true);
      }, { once: true });
    </script>
  </body>
</html>
