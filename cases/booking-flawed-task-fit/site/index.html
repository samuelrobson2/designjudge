<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Book an appointment · Harbour Physio</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      #section-practitioner { display: none !important; }
      .callback__hint { color: var(--muted); margin: -4px 0 16px; }
      .callback__label { font-weight: 600; margin-bottom: 12px; }
      .callback .chip:has(input:checked) { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--primary-tint); color: var(--primary-hover); }
      .field select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); font: inherit; color: inherit; }
      .field-hint { font-size: 14px; color: var(--muted); }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#booking">Skip to booking form</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="#" aria-label="Harbour Physio home">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#0f766e" /><path d="M9 17c3-5 11-5 14 0M11 21c2.5-3 7.5-3 10 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" /></svg>
          <span class="brand__name">Harbour Physio</span>
          <span class="brand__location">Clapham</span>
        </a>
        <a class="header-phone" href="tel:02079460321">020 7946 0321</a>
      </div>
    </header>
    <main id="app" class="page"></main>
    <script type="module" src="app.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        {
          const apply = () => {
            document.querySelectorAll('.form-section:not(#section-practitioner) .step').forEach((s, i) => { if (s.textContent !== String(i + 1)) s.textContent = String(i + 1); });
            document.querySelectorAll('.summary__row').forEach((r) => { if (r.querySelector('dt')?.textContent.trim() === 'Practitioner') r.remove(); });
          };
          const mo = new MutationObserver(() => { mo.disconnect(); apply(); mo.observe(document.body, { childList: true, subtree: true, attributes: true }); });
          apply();
          mo.observe(document.body, { childList: true, subtree: true, attributes: true });
        }
        {
          const picked = new Set();
          document.addEventListener('change', (e) => {
            const input = e.target.closest && e.target.closest('.callback input[type="checkbox"]');
            if (!input) return;
            const label = input.parentElement.textContent.trim();
            if (input.checked) picked.add(label); else picked.delete(label);
          }, true);
          const apply = () => {
            const sec = document.getElementById('section-time');
            if (sec && !sec.querySelector('.callback')) {
              sec.querySelectorAll('.date-strip, .slots, .empty-state').forEach((el) => el.remove());
              const h = sec.querySelector('#h-time'); if (h) h.textContent = 'When can we call you?';
              const box = document.createElement('div');
              box.className = 'callback';
              box.innerHTML = '<p class="callback__hint">We will phone you within two working days to arrange your appointment.</p><p class="callback__label">Best time to call</p><div class="chip-row">' + ['Weekday mornings', 'Weekday afternoons', 'Evenings after 5pm', 'Saturdays'].map((l) => '<label class="chip"><input type="checkbox" class="visually-hidden"' + (picked.has(l) ? ' checked' : '') + ' />' + l + '</label>').join('') + '</div>';
              sec.append(box);
            }
            document.querySelectorAll('.error-summary a[href="#section-time"], #time-error').forEach((el) => { if (el.textContent !== 'Choose when we can call you') el.textContent = 'Choose when we can call you'; });
            document.querySelectorAll('.summary__row').forEach((r) => {
              const dt = r.querySelector('dt'); const label = dt?.textContent.trim();
              if (label === 'Time') r.remove();
              if (label === 'Date') { dt.textContent = 'Date and time'; const dd = r.querySelector('dd'); if (dd.textContent !== 'Arranged by phone') { dd.textContent = 'Arranged by phone'; dd.className = 'is-empty'; } }
            });
          };
          const mo = new MutationObserver(() => { mo.disconnect(); apply(); mo.observe(document.body, { childList: true, subtree: true, attributes: true }); });
          apply();
          mo.observe(document.body, { childList: true, subtree: true, attributes: true });
        }
        {
          const kept = {};
          const keep = (e) => { if (['pet-name', 'species', 'breed'].includes(e.target.id)) kept[e.target.id] = e.target.value; };
          document.addEventListener('input', keep, true);
          document.addEventListener('change', keep, true);
          const apply = () => {
            const phone = document.getElementById('field-phone');
            if (phone && !document.getElementById('field-pet-name')) {
              phone.insertAdjacentHTML('afterend', '<div class="field" id="field-pet-name"><label for="pet-name">Pet\'s name</label><input id="pet-name" name="pet-name" /></div><div class="field" id="field-species"><label for="species">Species</label><select id="species" name="species"><option>Dog</option><option>Cat</option><option>Rabbit</option><option>Other</option></select></div><div class="field" id="field-breed"><label for="breed">Breed <span class="optional">(optional)</span></label><input id="breed" name="breed" /></div>');
              Object.entries(kept).forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.value = v; });
            }
            const notes = document.getElementById('notes');
            if (notes && !document.getElementById('notes-hint')) {
              notes.insertAdjacentHTML('beforebegin', '<p class="field-hint" id="notes-hint">For example, your pet\'s symptoms or vaccination history.</p>');
              notes.setAttribute('aria-describedby', 'notes-hint');
            }
          };
          const mo = new MutationObserver(() => { mo.disconnect(); apply(); mo.observe(document.body, { childList: true, subtree: true, attributes: true }); });
          apply();
          mo.observe(document.body, { childList: true, subtree: true, attributes: true });
        }
      }, { once: true });
    </script>
  </body>
</html>
